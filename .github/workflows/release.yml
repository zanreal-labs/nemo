name: Release

on:
  push:
    branches:
      - main

# Scoped to what changesets/action actually needs: it pushes the version branch and tags
# (contents), opens the release pull request (pull-requests), and npm provenance is minted from
# the OIDC token (id-token), which `publishConfig.provenance` requires at publish time.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Prepare
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # npm trusted publishing (OIDC) needs npm >= 11.5.1 and a registry set up by setup-node.
      # Without these two steps `changeset publish` ran the runner's bundled npm with no usable
      # credentials, and the registry answered the PUT with E404 (2026-08-27, 2026-09-28).
      # Same setup as zanreal-labs/search.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g "npm@^11.5.1"

      # This job holds NPM_TOKEN, so it is the one place a dependency lifecycle script would be
      # most valuable to an attacker. Install exactly what the lockfile resolves and run none of
      # them; the release build needs neither.
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
